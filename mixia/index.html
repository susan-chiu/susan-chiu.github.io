<h2>常見問題</h2>
<p><b>卡關了怎麼辦？</b><br>遊戲畫面上方有「提示」按鈕，每一題都有提示。每個故事也都可以從「選擇章節」直接跳到解鎖過的章節。</p>
<p><b>遊戲進度會不見嗎？</b><br>進度存在你的手機裡，關掉 App 也會保留。刪除 App 的話，進度會一起刪除。</p>
<p><b>沒有網路可以玩嗎？</b><br>可以。所有故事、圖片和影片都已經包在 App 裡。</p>
<p><b>有聲音嗎？</b><br>有。點畫面上的「音效」可以開關，建議戴耳機。</p>
